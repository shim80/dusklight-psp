name: Source Link lighting iteration

on:
  push:
    branches:
      - agent/psp-pc-fidelity-startup
    paths:
      - .github/workflows/fidelity-link-lighting.yml

permissions:
  contents: write

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable source-approx lighting for Link only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dusklight-main/platforms/psp/src/canonical_game.cpp')
          s = p.read_text()
          replacements = {
              'output.render_profile = playable::RenderProfile::KnownGoodUnlit;':
                  'output.render_profile = playable::RenderProfile::CandidateGame;',
              'output.lighting_mode = playable::LightingMode::Off;':
                  'output.lighting_mode = playable::LightingMode::SourceApprox;',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'expected one source lighting anchor: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- dusklight-main/platforms/psp/src/canonical_game.cpp

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake git curl xz-utils

      - name: Bootstrap pinned PSP toolchain
        run: ./scripts/bootstrap-repro.sh

      - name: Build product EBOOT
        run: |
          export PSPDEV="$GITHUB_WORKSPACE/.tools/pspdev"
          export PSPSDK="$PSPDEV/psp/sdk"
          export PATH="$PSPDEV/bin:$PSPSDK/bin:$PATH"
          psp-cmake -S test/dusklight-psp -B .work/build/link-lighting -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build .work/build/link-lighting -j 4
          "$PSPDEV/bin/psp-objdump" -f .work/build/link-lighting/dusklight_psp.elf | tee .work/link-lighting-objdump.log
          grep -F 'architecture: mips:allegrex' .work/link-lighting-objdump.log
          sha256sum .work/build/link-lighting/EBOOT.PBP | tee .work/link-lighting-eboot.sha256

      - name: Build direct-game capture harness
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dusklight-main/platforms/psp/src/canonical_startup_entry.cpp')
          s = p.read_text()
          needle = 'int run_canonical_startup_then_game() {\n'
          if s.count(needle) != 1:
              raise SystemExit('startup entry contract changed')
          p.write_text(s.replace(needle, needle + '    // CI framebuffer harness only; restored before commit.\n    return run_canonical_game();\n', 1))
          PY
          export PSPDEV="$GITHUB_WORKSPACE/.tools/pspdev"
          export PSPSDK="$PSPDEV/psp/sdk"
          export PATH="$PSPDEV/bin:$PSPSDK/bin:$PATH"
          psp-cmake -S test/dusklight-psp -B .work/build/link-lighting-harness -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build .work/build/link-lighting-harness -j 4
          git checkout -- dusklight-main/platforms/psp/src/canonical_startup_entry.cpp
          git diff --check

      - uses: actions/upload-artifact@v4
        with:
          name: psp-fidelity-link-lighting
          path: |
            .work/build/link-lighting/EBOOT.PBP
            .work/build/link-lighting-harness/EBOOT.PBP
            .work/link-lighting-eboot.sha256
            .work/link-lighting-objdump.log
          if-no-files-found: error
          retention-days: 7

      - name: Publish Link lighting and remove iteration workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dusklight-main/platforms/psp/src/canonical_game.cpp
          git rm .github/workflows/fidelity-link-lighting.yml
          git diff --cached --check
          git commit -m 'Enable source-approx Link lighting in F_SP108'
          git push origin HEAD:agent/psp-pc-fidelity-startup
