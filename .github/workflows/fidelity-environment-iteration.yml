name: Source environment clear-color iteration

on:
  push:
    branches:
      - agent/psp-pc-fidelity-startup
    paths:
      - .github/workflows/fidelity-environment-iteration.yml

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire source environment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dusklight-main/platforms/psp/src/canonical_game.cpp')
          s = p.read_text()

          global_anchor = 'alignas(16) std::uint8_t g_command_list[kCommandListBytes] = {};\n'
          global_insert = global_anchor + 'static environment::PspEnvironmentRuntime g_environment_runtime = {};\n'
          if s.count(global_anchor) != 1:
              raise SystemExit('environment global anchor changed')
          s = s.replace(global_anchor, global_insert, 1)

          env_anchor = '    output.environment = nullptr;\n'
          env_replace = (
              '    output.environment = g_environment_runtime.active_valid\n'
              '        ? &g_environment_runtime.material\n'
              '        : nullptr;\n'
          )
          if s.count(env_anchor) != 1:
              raise SystemExit('render environment anchor changed')
          s = s.replace(env_anchor, env_replace, 1)

          actor_anchor = (
              '    if (room::read_u32(room_packages->scene.view.bytes + 136) !=\n'
              '        kExpectedSourceActors) {\n'
              '        *error_category = "scene contract";\n'
              '        *error_detail = "unexpected source actor count";\n'
              '        unload_canonical_common_packages(common_packages);\n'
              '        unload_canonical_room_packages(room_packages);\n'
              '        return false;\n'
              '    }\n\n'
          )
          env_init = actor_anchor + (
              '    room::EnvironmentRecordV4 source_environment = {};\n'
              '    g_environment_runtime.initialize();\n'
              '    if (room::read_dpsc_environment_v4(\n'
              '            room_packages->scene.view, &source_environment) !=\n'
              '            room::PackageError::Ok ||\n'
              '        start.room < 0 ||\n'
              '        source_environment.room_index !=\n'
              '            static_cast<std::uint32_t>(start.room) ||\n'
              '        g_environment_runtime.load(\n'
              '            room_packages->scene.view, source_environment.stage_hash,\n'
              '            source_environment.room_index, 1) != environment::Error::Ok ||\n'
              '        g_environment_runtime.activate(1) != environment::Error::Ok ||\n'
              '        !g_environment_runtime.consistent(1)) {\n'
              '        *error_category = "environment";\n'
              '        *error_detail = "source environment initialization failed";\n'
              '        unload_canonical_common_packages(common_packages);\n'
              '        unload_canonical_room_packages(room_packages);\n'
              '        return false;\n'
              '    }\n\n'
          )
          if s.count(actor_anchor) != 1:
              raise SystemExit('environment init anchor changed')
          s = s.replace(actor_anchor, env_init, 1)

          old_log = 'render=game_alpha frame=1'
          if s.count(old_log) != 1:
              raise SystemExit('render log anchor changed')
          s = s.replace(old_log, 'render=game_alpha_source_clear frame=1', 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- dusklight-main/platforms/psp/src/canonical_game.cpp
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake git curl xz-utils
      - name: Bootstrap pinned PSP toolchain
        run: ./scripts/bootstrap-repro.sh
      - name: Build product EBOOT
        run: |
          export PSPDEV="$GITHUB_WORKSPACE/.tools/pspdev"
          export PSPSDK="$PSPDEV/psp/sdk"
          export PATH="$PSPDEV/bin:$PSPSDK/bin:$PATH"
          psp-cmake -S test/dusklight-psp -B .work/build/source-environment -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build .work/build/source-environment -j 4
          "$PSPDEV/bin/psp-objdump" -f .work/build/source-environment/dusklight_psp.elf | tee .work/environment-objdump.log
          grep -F 'architecture: mips:allegrex' .work/environment-objdump.log
          sha256sum .work/build/source-environment/EBOOT.PBP | tee .work/environment-eboot.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: psp-fidelity-source-environment
          path: |
            .work/build/source-environment/EBOOT.PBP
            .work/environment-eboot.sha256
            .work/environment-objdump.log
          if-no-files-found: error
          retention-days: 7
      - name: Publish product change and clean workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dusklight-main/platforms/psp/src/canonical_game.cpp
          git rm .github/workflows/fidelity-environment-iteration.yml
          git diff --cached --check
          git commit -m 'Use source environment clear color in F_SP108'
          git push origin HEAD:agent/psp-pc-fidelity-startup
