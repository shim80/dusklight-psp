name: Fetch standalone 7zz helper

on:
  pull_request:
    branches:
      - agent/psp-pc-fidelity-startup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helper:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch official 7-Zip Linux x64
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o 7z.tar.xz https://github.com/ip7z/7zip/releases/download/26.02/7z2602-linux-x64.tar.xz
          mkdir unpack tool
          tar -xf 7z.tar.xz -C unpack
          cp unpack/7zz tool/7zz
          chmod +x tool/7zz
          ./tool/7zz i | head -n 8
          sha256sum tool/7zz > tool/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-7zz-helper
          path: tool
          retention-days: 1
