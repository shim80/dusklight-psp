name: Link Epona matrix oracle

on:
  pull_request:
    branches:
      - agent/psp-pc-fidelity-startup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix-oracle:
    runs-on: ubuntu-24.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake curl git libasound2-dev libclang-dev libcurl4-openssl-dev libdbus-1-dev libfreetype-dev libglu1-mesa-dev libgtk-3-dev libncurses5-dev libpng-dev libpulse-dev libudev-dev libvulkan-dev libx11-xcb-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxss-dev libxtst-dev lld ninja-build python-is-python3 python3 python3-markupsafe zlib1g-dev
      - name: Checkout exact historical Dusklight snapshot
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/TwilitRealm/dusklight.git dusklight
          cd dusklight
          git checkout 1bae8a5e6a812217ca33ba533e707ecfa64b1553
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = 1bae8a5e6a812217ca33ba533e707ecfa64b1553
      - name: Add read-only matrix trace
        shell: bash
        run: |
          set -euo pipefail
          cd dusklight
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/d/actor/d_a_horse.cpp')
          s = p.read_text()
          s = s.replace('#include <cstring>\n', '#include <cstring>\n#include <cstdio>\n#include <cstdlib>\n', 1)
          anchor = '''    dMeter2Info_setHorseLifeCount(m_lashCnt);\n    return 1;\n}'''
          repl = '''    dMeter2Info_setHorseLifeCount(m_lashCnt);\n#ifdef DUSKLIGHT_REFERENCE_TRACE\n    const char* tr = std::getenv("DUSKLIGHT_LINK_EPONA_TRACE");\n    if (tr && tr[0] == '1' && tr[1] == '\\0') {\n        static unsigned long long f = 0;\n        const MtxP mb = m_model ? m_model->getBaseTRMtx() : NULL;\n        const MtxP root = m_model ? m_model->getAnmMtx(0) : NULL;\n        const MtxP saddle = m_model ? m_model->getAnmMtx(21) : NULL;\n        std::fprintf(stderr, "[HMX] f=%llu proc=%u demo=%u anim=%u af=%.9g ar=%.9g pos=%.9g,%.9g,%.9g ang=%d,%d,%d mb=%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g root=%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g saddle=%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g\\n", f, (unsigned)m_procID, (unsigned)m_demoMode, (unsigned)m_anmIdx[0], m_frameCtrl[0].getFrame(), m_frameCtrl[0].getRate(), current.pos.x, current.pos.y, current.pos.z, (int)shape_angle.x, (int)shape_angle.y, (int)shape_angle.z, mb?mb[0][0]:0,mb?mb[0][1]:0,mb?mb[0][2]:0,mb?mb[0][3]:0,mb?mb[1][0]:0,mb?mb[1][1]:0,mb?mb[1][2]:0,mb?mb[1][3]:0,mb?mb[2][0]:0,mb?mb[2][1]:0,mb?mb[2][2]:0,mb?mb[2][3]:0,root?root[0][0]:0,root?root[0][1]:0,root?root[0][2]:0,root?root[0][3]:0,root?root[1][0]:0,root?root[1][1]:0,root?root[1][2]:0,root?root[1][3]:0,root?root[2][0]:0,root?root[2][1]:0,root?root[2][2]:0,root?root[2][3]:0,saddle?saddle[0][0]:0,saddle?saddle[0][1]:0,saddle?saddle[0][2]:0,saddle?saddle[0][3]:0,saddle?saddle[1][0]:0,saddle?saddle[1][1]:0,saddle?saddle[1][2]:0,saddle?saddle[1][3]:0,saddle?saddle[2][0]:0,saddle?saddle[2][1]:0,saddle?saddle[2][2]:0,saddle?saddle[2][3]:0);\n        std::fflush(stderr); ++f;\n    }\n#endif\n    return 1;\n}'''
          if anchor not in s:
              raise SystemExit('horse anchor missing')
          p.write_text(s.replace(anchor, repl, 1))

          p = Path('src/d/actor/d_a_alink.cpp')
          s = p.read_text()
          s = s.replace('#include "d/actor/d_a_horse.h"\n', '#include "d/actor/d_a_horse.h"\n#include <cstdio>\n#include <cstdlib>\n', 1)
          anchor = '''    return 1;\n}\n\nstatic int daAlink_Execute(daAlink_c* i_this) {'''
          repl = '''#ifdef DUSKLIGHT_REFERENCE_TRACE\n    const char* tr = std::getenv("DUSKLIGHT_LINK_EPONA_TRACE");\n    if (tr && tr[0] == '1' && tr[1] == '\\0') {\n        static unsigned long long f = 0;\n        const MtxP mb = mpLinkModel ? mpLinkModel->getBaseTRMtx() : NULL;\n        const MtxP j0 = mpLinkModel ? mpLinkModel->getAnmMtx(0) : NULL;\n        const MtxP j4 = mpLinkModel ? mpLinkModel->getAnmMtx(4) : NULL;\n        std::fprintf(stderr, "[LMX] f=%llu proc=%u anim=%u af=%.9g ar=%.9g pos=%.9g,%.9g,%.9g ang=%d,%d,%d mb=%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g j0=%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g j4=%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g\\n", f, (unsigned)mProcID, (unsigned)mUnderAnmHeap[0].getIdx(), mUnderFrameCtrl[0].getFrame(), mUnderFrameCtrl[0].getRate(), current.pos.x, current.pos.y, current.pos.z, (int)shape_angle.x, (int)shape_angle.y, (int)shape_angle.z, mb?mb[0][0]:0,mb?mb[0][1]:0,mb?mb[0][2]:0,mb?mb[0][3]:0,mb?mb[1][0]:0,mb?mb[1][1]:0,mb?mb[1][2]:0,mb?mb[1][3]:0,mb?mb[2][0]:0,mb?mb[2][1]:0,mb?mb[2][2]:0,mb?mb[2][3]:0,j0?j0[0][0]:0,j0?j0[0][1]:0,j0?j0[0][2]:0,j0?j0[0][3]:0,j0?j0[1][0]:0,j0?j0[1][1]:0,j0?j0[1][2]:0,j0?j0[1][3]:0,j0?j0[2][0]:0,j0?j0[2][1]:0,j0?j0[2][2]:0,j0?j0[2][3]:0,j4?j4[0][0]:0,j4?j4[0][1]:0,j4?j4[0][2]:0,j4?j4[0][3]:0,j4?j4[1][0]:0,j4?j4[1][1]:0,j4?j4[1][2]:0,j4?j4[1][3]:0,j4?j4[2][0]:0,j4?j4[2][1]:0,j4?j4[2][2]:0,j4?j4[2][3]:0);\n        std::fflush(stderr); ++f;\n    }\n#endif\n    return 1;\n}\n\nstatic int daAlink_Execute(daAlink_c* i_this) {'''
          if anchor not in s:
              raise SystemExit('link anchor missing')
          p.write_text(s.replace(anchor, repl, 1))

          p = Path('CMakeLists.txt')
          s = p.read_text()
          i = s.find('\n', s.find('project('))
          p.write_text(s[:i+1] + 'add_compile_definitions(DUSKLIGHT_REFERENCE_TRACE=1)\n' + s[i+1:])
          PY
          grep -q '\[HMX\]' src/d/actor/d_a_horse.cpp
          grep -q '\[LMX\]' src/d/actor/d_a_alink.cpp
      - name: Build Linux RelWithDebInfo
        run: |
          cd dusklight
          cmake --preset linux-default-relwithdebinfo
          cmake --build --preset linux-default-relwithdebinfo -j2
          strings build/linux-default-relwithdebinfo/dusklight | grep -q '\[HMX\]'
          strings build/linux-default-relwithdebinfo/dusklight | grep -q '\[LMX\]'
      - name: Stage
        run: |
          mkdir -p pc-trace
          cp dusklight/build/linux-default-relwithdebinfo/dusklight pc-trace/dusklight-trace
          sha256sum pc-trace/dusklight-trace > pc-trace/SHA256SUMS.txt
          echo upstream=1bae8a5e6a812217ca33ba533e707ecfa64b1553 > pc-trace/TRACE_INFO.txt
          echo trace=full-3x4-horse-root-saddle-link-j0-j4 >> pc-trace/TRACE_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: link-epona-matrix-oracle-fixed
          path: pc-trace
          retention-days: 1
