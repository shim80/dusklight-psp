name: Apply intro DPCM mainline temporary

on:
  push:
    branches:
      - agent/intro-dpcm-mainline

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Temporarily apply validated intro DPCM onto current main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated DPCM tree and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/intro-dpcm-publish-stage
          files=(
            .github/workflows/psp-intro-dpcm.yml
            dusklight-main/platforms/psp/CMakeLists.txt
            dusklight-main/platforms/psp/include/dusk/psp/canonical_assets.hpp
            dusklight-main/platforms/psp/include/dusk/psp/canonical_startup_loader.hpp
            dusklight-main/platforms/psp/include/dusk/psp/startup_camera.hpp
            dusklight-main/platforms/psp/include/dusk/psp/startup_camera_track.hpp
            dusklight-main/platforms/psp/src/canonical_assets.cpp
            dusklight-main/platforms/psp/src/canonical_startup_entry.cpp
            dusklight-main/platforms/psp/src/canonical_startup_loader.cpp
            dusklight-main/platforms/psp/src/startup_camera.cpp
            dusklight-main/platforms/psp/src/startup_camera_track.cpp
            test/canonical-assets-host/main.cpp
            test/dusklight-psp/CMakeLists.txt
            test/startup-camera-host/CMakeLists.txt
            test/startup-camera-host/main.cpp
          )
          git checkout origin/agent/intro-dpcm-publish-stage -- "${files[@]}"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/psp-intro-dpcm.yml')
          s = p.read_text()
          s = s.replace('      - agent/intro-dpcm-publish-stage\n      - agent/intro-environment\n', '      - agent/intro-dpcm-mainline\n      - agent/intro-environment\n      - main\n')
          p.write_text(s)
          PY
          git rm .github/workflows/apply-intro-dpcm-mainline-temp.yml
          git diff --check
          git config user.name 'shim80'
          git config user.email '22941009+shim80@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m 'Replay source demo38_01 camera in PSP startup'
          git push origin HEAD:agent/intro-dpcm-mainline
