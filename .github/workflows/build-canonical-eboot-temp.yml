name: Build canonical EBOOT temporary

on:
  push:
    branches:
      - agent/fsp108-alpha-test-foliage-v2

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake git curl xz-utils
      - name: Bootstrap pinned PSP toolchain
        run: ./scripts/bootstrap-repro.sh
      - name: Build canonical EBOOT
        run: |
          export PSPDEV="$GITHUB_WORKSPACE/.tools/pspdev"
          export PSPSDK="$PSPDEV/psp/sdk"
          export PATH="$PSPDEV/bin:$PSPSDK/bin:$PATH"
          psp-cmake -S test/dusklight-psp -B .work/build/dusklight-psp -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build .work/build/dusklight-psp -j 4
          test -f .work/build/dusklight-psp/EBOOT.PBP
          sha256sum .work/build/dusklight-psp/EBOOT.PBP > .work/canonical-eboot.sha256
      - name: Upload canonical EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: canonical-eboot-foliage-v2
          path: |
            .work/build/dusklight-psp/EBOOT.PBP
            .work/canonical-eboot.sha256
          if-no-files-found: error
          retention-days: 1
