name: Revert failed Link lighting candidate

on:
  push:
    branches:
      - agent/psp-pc-fidelity-startup
    paths:
      - .github/workflows/revert-link-lighting.yml

permissions:
  contents: write

jobs:
  revert-build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore visually accepted Link path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dusklight-main/platforms/psp/src/canonical_game.cpp')
          s = p.read_text()
          replacements = {
              'output.render_profile = playable::RenderProfile::CandidateGame;':
                  'output.render_profile = playable::RenderProfile::KnownGoodUnlit;',
              'output.lighting_mode = playable::LightingMode::SourceApprox;':
                  'output.lighting_mode = playable::LightingMode::Off;',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'expected one failed lighting anchor: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check

      - name: Install and build Allegrex target
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake git curl xz-utils
          ./scripts/bootstrap-repro.sh
          export PSPDEV="$GITHUB_WORKSPACE/.tools/pspdev"
          export PSPSDK="$PSPDEV/psp/sdk"
          export PATH="$PSPDEV/bin:$PSPSDK/bin:$PATH"
          psp-cmake -S test/dusklight-psp -B .work/build/revert-link-lighting -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build .work/build/revert-link-lighting -j 4
          "$PSPDEV/bin/psp-objdump" -f .work/build/revert-link-lighting/dusklight_psp.elf | tee .work/revert-link-lighting-objdump.log
          grep -F 'architecture: mips:allegrex' .work/revert-link-lighting-objdump.log

      - name: Publish accepted state and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dusklight-main/platforms/psp/src/canonical_game.cpp
          git rm .github/workflows/revert-link-lighting.yml
          git diff --cached --check
          git commit -m 'Revert black Link lighting candidate'
          git push origin HEAD:agent/psp-pc-fidelity-startup
