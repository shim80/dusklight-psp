name: Build instrumented Dusklight PC reference

on:
  push:
    branches:
      - agent/pc-capture-fetch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-trace-reference:
    runs-on: ubuntu-24.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake curl git libasound2-dev libclang-dev libcurl4-openssl-dev libdbus-1-dev libfreetype-dev libglu1-mesa-dev libgtk-3-dev libncurses5-dev libpng-dev libpulse-dev libudev-dev libvulkan-dev libx11-xcb-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxss-dev libxtst-dev lld ninja-build python-is-python3 python3 python3-markupsafe zlib1g-dev
      - name: Checkout exact historical Dusklight snapshot
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/TwilitRealm/dusklight.git dusklight
          cd dusklight
          git checkout 1bae8a5e6a812217ca33ba533e707ecfa64b1553
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = 1bae8a5e6a812217ca33ba533e707ecfa64b1553
      - name: Add read-only Link Epona trace
        shell: bash
        run: |
          set -euo pipefail
          cd dusklight
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/d/actor/d_a_horse.cpp')
          s = p.read_text()
          s = s.replace('#include <cstring>\n', '#include <cstring>\n#include <cstdio>\n#include <cstdlib>\n', 1)
          anchor = '''    dMeter2Info_setHorseLifeCount(m_lashCnt);\n    return 1;\n}'''
          insert = '''    dMeter2Info_setHorseLifeCount(m_lashCnt);\n\n    const char* traceHorse = std::getenv("DUSKLIGHT_LINK_Epona_TRACE");\n    const char* traceStage = dComIfGp_getStartStageName();\n    if (traceHorse != NULL && traceHorse[0] == '1' && traceHorse[1] == '\\0' &&\n        traceStage != NULL && std::strcmp(traceStage, "F_SP102") == 0) {\n        static unsigned long long traceFrame = 0;\n        const MtxP saddle = (m_model != NULL) ? m_model->getAnmMtx(21) : NULL;\n        std::fprintf(stderr,\n            "[HORSETRACE] frame=%llu pos=%.9g,%.9g,%.9g yaw=%d proc=%u demo=%u anim=%u anim_frame=%.9g anim_rate=%.9g speedF=%.9g saddle=%.9g,%.9g,%.9g\\n",\n            traceFrame, current.pos.x, current.pos.y, current.pos.z, (int)shape_angle.y,\n            (unsigned)m_procID, (unsigned)m_demoMode, (unsigned)m_anmIdx[0],\n            m_frameCtrl[0].getFrame(), m_frameCtrl[0].getRate(), speedF,\n            saddle != NULL ? saddle[0][3] : 0.0f,\n            saddle != NULL ? saddle[1][3] : 0.0f,\n            saddle != NULL ? saddle[2][3] : 0.0f);\n        std::fflush(stderr);\n        ++traceFrame;\n    }\n    return 1;\n}'''
          if anchor not in s:
              raise SystemExit('horse trace anchor missing')
          p.write_text(s.replace(anchor, insert, 1))

          p = Path('src/d/actor/d_a_alink.cpp')
          s = p.read_text()
          s = s.replace('#include "d/actor/d_a_horse.h"\n', '#include "d/actor/d_a_horse.h"\n#include <cstdio>\n#include <cstdlib>\n', 1)
          anchor = '''    return 1;\n}\n\nstatic int daAlink_Execute(daAlink_c* i_this) {'''
          insert = '''    const char* traceLink = std::getenv("DUSKLIGHT_LINK_Epona_TRACE");\n    const char* traceStage = dComIfGp_getStartStageName();\n    if (traceLink != NULL && traceLink[0] == '1' && traceLink[1] == '\\0' &&\n        traceStage != NULL && std::strcmp(traceStage, "F_SP102") == 0) {\n        static unsigned long long traceFrame = 0;\n        const MtxP base = (mpLinkModel != NULL) ? mpLinkModel->getBaseTRMtx() : NULL;\n        std::fprintf(stderr,\n            "[LINKTRACE] frame=%llu pos=%.9g,%.9g,%.9g yaw=%d proc=%u anim=%u anim_frame=%.9g anim_rate=%.9g base=%.9g,%.9g,%.9g\\n",\n            traceFrame, current.pos.x, current.pos.y, current.pos.z, (int)shape_angle.y,\n            (unsigned)mProcID, (unsigned)mUnderAnmHeap[0].getIdx(),\n            mUnderFrameCtrl[0].getFrame(), mUnderFrameCtrl[0].getRate(),\n            base != NULL ? base[0][3] : 0.0f,\n            base != NULL ? base[1][3] : 0.0f,\n            base != NULL ? base[2][3] : 0.0f);\n        std::fflush(stderr);\n        ++traceFrame;\n    }\n    return 1;\n}\n\nstatic int daAlink_Execute(daAlink_c* i_this) {'''
          if anchor not in s:
              raise SystemExit('link trace anchor missing')
          p.write_text(s.replace(anchor, insert, 1))
          PY
      - name: Build Linux RelWithDebInfo
        run: |
          set -euo pipefail
          cd dusklight
          cmake --preset linux-default-relwithdebinfo
          cmake --build --preset linux-default-relwithdebinfo -j2
      - name: Stage instrumented oracle
        run: |
          set -euo pipefail
          mkdir -p pc-trace
          cp dusklight/build/linux-default-relwithdebinfo/dusklight pc-trace/dusklight-trace
          sha256sum pc-trace/dusklight-trace > pc-trace/SHA256SUMS.txt
          printf '%s\n' 'upstream=1bae8a5e6a812217ca33ba533e707ecfa64b1553' > pc-trace/TRACE_INFO.txt
          printf '%s\n' 'trace=read-only Link/Epona state and transforms' >> pc-trace/TRACE_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dusklight-pc-reference-1bae8a5e-link-epona-trace
          path: pc-trace
          retention-days: 1
