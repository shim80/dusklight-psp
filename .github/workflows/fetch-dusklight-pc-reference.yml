name: Build instrumented Dusklight PC reference

on:
  push:
    branches:
      - agent/pc-capture-fetch
  pull_request:
    branches:
      - agent/psp-pc-fidelity-startup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-trace-reference:
    runs-on: ubuntu-24.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake curl git libasound2-dev libclang-dev libcurl4-openssl-dev libdbus-1-dev libfreetype-dev libglu1-mesa-dev libgtk-3-dev libncurses5-dev libpng-dev libpulse-dev libudev-dev libvulkan-dev libx11-xcb-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxss-dev libxtst-dev lld ninja-build python-is-python3 python3 python3-markupsafe zlib1g-dev
      - name: Checkout exact historical Dusklight snapshot
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/TwilitRealm/dusklight.git dusklight
          cd dusklight
          git checkout 1bae8a5e6a812217ca33ba533e707ecfa64b1553
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = 1bae8a5e6a812217ca33ba533e707ecfa64b1553
      - name: Add read-only complete Link Epona trace and joint dump
        shell: bash
        run: |
          set -euo pipefail
          cd dusklight
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/d/actor/d_a_horse.cpp')
          s=p.read_text()
          s=s.replace('#include <cstring>\n','#include <cstring>\n#include <cstdio>\n#include <cstdlib>\n',1)
          anchor='''    dMeter2Info_setHorseLifeCount(m_lashCnt);\n    return 1;\n}'''
          insert='''    dMeter2Info_setHorseLifeCount(m_lashCnt);\n#ifdef DUSKLIGHT_REFERENCE_TRACE\n    const char* tr = std::getenv("DUSKLIGHT_LINK_EPONA_TRACE");\n    const char* st = dComIfGp_getStartStageName();\n    if (tr != NULL && tr[0] == '1' && tr[1] == '\\0' && st != NULL && std::strcmp(st,"F_SP102") == 0) {\n        static unsigned long long tf=0;\n        const MtxP b=(m_model!=NULL)?m_model->getBaseTRMtx():NULL;\n        const MtxP r=(m_model!=NULL)?m_model->getAnmMtx(0):NULL;\n        const MtxP d=(m_model!=NULL)?m_model->getAnmMtx(21):NULL;\n        std::fprintf(stderr,"[HORSETRACE4] frame=%llu proc=%u demo=%u anim0=%u af0=%.9g ar0=%.9g anim1=%u af1=%.9g ar1=%.9g blend=%.9g anim2=%u af2=%.9g ar2=%.9g speedF=%.9g angle=%d,%d,%d base=%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g root=%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g saddle=%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g\\n",\n            tf,(unsigned)m_procID,(unsigned)m_demoMode,(unsigned)m_anmIdx[0],m_frameCtrl[0].getFrame(),m_frameCtrl[0].getRate(),\n            (unsigned)m_anmIdx[1],m_frameCtrl[1].getFrame(),m_frameCtrl[1].getRate(),m_anmRatio[1].getRatio(),\n            (unsigned)m_anmIdx[2],m_frameCtrl[2].getFrame(),m_frameCtrl[2].getRate(),speedF,(int)shape_angle.x,(int)shape_angle.y,(int)shape_angle.z,\n            b?b[0][0]:0,b?b[0][1]:0,b?b[0][2]:0,b?b[0][3]:0,b?b[1][0]:0,b?b[1][1]:0,b?b[1][2]:0,b?b[1][3]:0,b?b[2][0]:0,b?b[2][1]:0,b?b[2][2]:0,b?b[2][3]:0,\n            r?r[0][0]:0,r?r[0][1]:0,r?r[0][2]:0,r?r[0][3]:0,r?r[1][0]:0,r?r[1][1]:0,r?r[1][2]:0,r?r[1][3]:0,r?r[2][0]:0,r?r[2][1]:0,r?r[2][2]:0,r?r[2][3]:0,\n            d?d[0][0]:0,d?d[0][1]:0,d?d[0][2]:0,d?d[0][3]:0,d?d[1][0]:0,d?d[1][1]:0,d?d[1][2]:0,d?d[1][3]:0,d?d[2][0]:0,d?d[2][1]:0,d?d[2][2]:0,d?d[2][3]:0);\n        const char* jp=std::getenv("DUSKLIGHT_HORSE_JOINT_DUMP");\n        if (jp != NULL && jp[0] != '\\0' && tf <= 1690) {\n            static FILE* jf=NULL;\n            if (jf==NULL) { jf=std::fopen(jp,"wb"); if (jf!=NULL) { const unsigned int hh[3]={1,38,12}; std::fwrite("HJNT",1,4,jf); std::fwrite(hh,sizeof(unsigned int),3,jf); } }\n            if (jf!=NULL) { const unsigned int fr=(unsigned int)tf; std::fwrite(&fr,sizeof(fr),1,jf); for (int j=0;j<38;j++) { const MtxP m=m_model->getAnmMtx(j); std::fwrite(m,sizeof(float),12,jf); } std::fflush(jf); }\n        }\n        std::fflush(stderr); ++tf;\n    }\n#endif\n    return 1;\n}'''
          if anchor not in s: raise SystemExit('horse anchor missing')
          p.write_text(s.replace(anchor,insert,1))

          p=Path('src/d/actor/d_a_alink.cpp')
          s=p.read_text()
          s=s.replace('#include "d/actor/d_a_horse.h"\n','#include "d/actor/d_a_horse.h"\n#include <cstdio>\n#include <cstdlib>\n',1)
          anchor='''    return 1;\n}\n\nstatic int daAlink_Execute(daAlink_c* i_this) {'''
          insert='''#ifdef DUSKLIGHT_REFERENCE_TRACE\n    const char* tr = std::getenv("DUSKLIGHT_LINK_EPONA_TRACE");\n    const char* st = dComIfGp_getStartStageName();\n    if (tr != NULL && tr[0] == '1' && tr[1] == '\\0' && st != NULL && std::strcmp(st,"F_SP102") == 0) {\n        static unsigned long long tf=0;\n        const MtxP b=(mpLinkModel!=NULL)?mpLinkModel->getBaseTRMtx():NULL;\n        const MtxP r=(mpLinkModel!=NULL)?mpLinkModel->getAnmMtx(0):NULL;\n        std::fprintf(stderr,"[LINKTRACE4] frame=%llu proc=%u lower0=%u l0f=%.9g l0r=%.9g lower1=%u l1f=%.9g l1r=%.9g upper=%u uf=%.9g ur=%.9g angle=%d,%d,%d base=%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g root=%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g,%.9g\\n",\n            tf,(unsigned)mProcID,(unsigned)mUnderAnmHeap[0].getIdx(),mUnderFrameCtrl[0].getFrame(),mUnderFrameCtrl[0].getRate(),\n            (unsigned)mUnderAnmHeap[1].getIdx(),mUnderFrameCtrl[1].getFrame(),mUnderFrameCtrl[1].getRate(),\n            (unsigned)mUpperAnmHeap[0].getIdx(),mUpperFrameCtrl[0].getFrame(),mUpperFrameCtrl[0].getRate(),(int)shape_angle.x,(int)shape_angle.y,(int)shape_angle.z,\n            b?b[0][0]:0,b?b[0][1]:0,b?b[0][2]:0,b?b[0][3]:0,b?b[1][0]:0,b?b[1][1]:0,b?b[1][2]:0,b?b[1][3]:0,b?b[2][0]:0,b?b[2][1]:0,b?b[2][2]:0,b?b[2][3]:0,\n            r?r[0][0]:0,r?r[0][1]:0,r?r[0][2]:0,r?r[0][3]:0,r?r[1][0]:0,r?r[1][1]:0,r?r[1][2]:0,r?r[1][3]:0,r?r[2][0]:0,r?r[2][1]:0,r?r[2][2]:0,r?r[2][3]:0);\n        const char* jp=std::getenv("DUSKLIGHT_LINK_JOINT_DUMP");\n        if (jp != NULL && jp[0] != '\\0' && tf <= 1690) {\n            static FILE* jf=NULL;\n            if (jf==NULL) { jf=std::fopen(jp,"wb"); if (jf!=NULL) { const unsigned int hh[3]={1,35,12}; std::fwrite("LJNT",1,4,jf); std::fwrite(hh,sizeof(unsigned int),3,jf); } }\n            if (jf!=NULL) { const unsigned int fr=(unsigned int)tf; std::fwrite(&fr,sizeof(fr),1,jf); for (int j=0;j<35;j++) { const MtxP m=mpLinkModel->getAnmMtx(j); std::fwrite(m,sizeof(float),12,jf); } std::fflush(jf); }\n        }\n        std::fflush(stderr); ++tf;\n    }\n#endif\n    return 1;\n}\n\nstatic int daAlink_Execute(daAlink_c* i_this) {'''
          if anchor not in s: raise SystemExit('link anchor missing')
          p.write_text(s.replace(anchor,insert,1))
          PY
      - name: Enable trace compile define
        run: |
          set -euo pipefail
          cd dusklight
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CMakeLists.txt'); s=p.read_text(); marker='project('; pos=s.find('\n',s.find(marker)); s=s[:pos+1]+'add_compile_definitions(DUSKLIGHT_REFERENCE_TRACE=1)\n'+s[pos+1:]; p.write_text(s)
          PY
      - name: Build Linux RelWithDebInfo
        run: |
          set -euo pipefail
          cd dusklight
          cmake --preset linux-default-relwithdebinfo
          cmake --build --preset linux-default-relwithdebinfo -j2
      - name: Stage instrumented oracle
        run: |
          set -euo pipefail
          mkdir -p pc-trace
          cp dusklight/build/linux-default-relwithdebinfo/dusklight pc-trace/dusklight-trace
          sha256sum pc-trace/dusklight-trace > pc-trace/SHA256SUMS.txt
          printf '%s\n' 'upstream=1bae8a5e6a812217ca33ba533e707ecfa64b1553' > pc-trace/TRACE_INFO.txt
          printf '%s\n' 'trace=read-only full actor matrices + Horse blend + binary joint dump support' >> pc-trace/TRACE_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dusklight-pc-reference-1bae8a5e-link-epona-trace4
          path: pc-trace
          retention-days: 1
