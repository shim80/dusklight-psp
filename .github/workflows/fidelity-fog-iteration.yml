name: Source fog iteration

on:
  push:
    branches:
      - agent/psp-pc-fidelity-startup
    paths:
      - .github/workflows/fidelity-fog-iteration.yml

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decouple source fog from lighting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('dusklight-main/platforms/psp/src/playable_render.cpp')
          s = p.read_text()
          old = (
              '    if (input.environment == nullptr ||\n'
              '        input.lighting_mode == LightingMode::Off) {\n'
              '        sceGuDisable(GU_FOG);\n'
              '        sceGuDisable(GU_LIGHTING);\n'
              '        metrics->environment_records_loaded =\n'
              '            input.environment == nullptr ? 0 : 1;\n'
              '        metrics->environment_fog_enabled = false;\n'
              '        metrics->environment_lighting_enabled = false;\n'
              '        return;\n'
              '    }\n'
          )
          new = (
              '    if (input.environment == nullptr) {\n'
              '        sceGuDisable(GU_FOG);\n'
              '        sceGuDisable(GU_LIGHTING);\n'
              '        metrics->environment_records_loaded = 0;\n'
              '        metrics->environment_fog_enabled = false;\n'
              '        metrics->environment_lighting_enabled = false;\n'
              '        return;\n'
              '    }\n'
          )
          if s.count(old) != 1:
              raise SystemExit(f'configure_environment gate changed: {s.count(old)}')
          s = s.replace(old, new, 1)
          old = '    metrics->environment_lighting_enabled = true;\n'
          new = (
              '    metrics->environment_lighting_enabled =\n'
              '        input.lighting_mode != LightingMode::Off;\n'
          )
          if s.count(old) != 1:
              raise SystemExit('lighting metrics anchor changed')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('dusklight-main/platforms/psp/src/canonical_game.cpp')
          s = p.read_text()
          old = '    output.fog_mode = playable::FogMode::Off;\n'
          new = '    output.fog_mode = playable::FogMode::Source;\n'
          if s.count(old) != 1:
              raise SystemExit(f'fog mode anchor changed: {s.count(old)}')
          s = s.replace(old, new, 1)
          old_log = 'render=game_alpha_source_clear frame=1'
          if s.count(old_log) != 1:
              raise SystemExit('render log anchor changed')
          s = s.replace(old_log, 'render=game_alpha_source_fog frame=1', 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- dusklight-main/platforms/psp/src/playable_render.cpp dusklight-main/platforms/psp/src/canonical_game.cpp
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake git curl xz-utils
      - name: Bootstrap pinned PSP toolchain
        run: ./scripts/bootstrap-repro.sh
      - name: Build product EBOOT
        run: |
          export PSPDEV="$GITHUB_WORKSPACE/.tools/pspdev"
          export PSPSDK="$PSPDEV/psp/sdk"
          export PATH="$PSPDEV/bin:$PSPSDK/bin:$PATH"
          psp-cmake -S test/dusklight-psp -B .work/build/source-fog -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build .work/build/source-fog -j 4
          "$PSPDEV/bin/psp-objdump" -f .work/build/source-fog/dusklight_psp.elf | tee .work/fog-objdump.log
          grep -F 'architecture: mips:allegrex' .work/fog-objdump.log
          sha256sum .work/build/source-fog/EBOOT.PBP | tee .work/fog-eboot.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: psp-fidelity-source-fog
          path: |
            .work/build/source-fog/EBOOT.PBP
            .work/fog-eboot.sha256
            .work/fog-objdump.log
          if-no-files-found: error
          retention-days: 7
      - name: Publish product change and clean temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dusklight-main/platforms/psp/src/playable_render.cpp dusklight-main/platforms/psp/src/canonical_game.cpp
          git rm .github/workflows/fidelity-fog-iteration.yml
          if [ -f .github/workflows/capture-harness.yml ]; then git rm .github/workflows/capture-harness.yml; fi
          git diff --cached --check
          git commit -m 'Enable source fog without PSP lighting'
          git push origin HEAD:agent/psp-pc-fidelity-startup
