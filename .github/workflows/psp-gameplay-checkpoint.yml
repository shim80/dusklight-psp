name: PSP gameplay checkpoint

on:
  push:
    branches:
      - agent/source-demo-item-commit
      - agent/fix-psp-import-order
  workflow_dispatch:

jobs:
  build-chest-source-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake git curl xz-utils

      - name: Bootstrap pinned PSP toolchain and source tree
        run: ./scripts/bootstrap-repro.sh

      - name: Configure PSP chest checkpoint
        run: |
          export PSPDEV="$GITHUB_WORKSPACE/.tools/pspdev"
          export PSPSDK="$PSPDEV/psp/sdk"
          export PATH="$PSPDEV/bin:$PSPSDK/bin:$PATH"
          psp-cmake \
            -S "$GITHUB_WORKSPACE/.work/assembled/test/chest-source-full" \
            -B "$GITHUB_WORKSPACE/.work/build/chest-source-full" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build PSP EBOOT and verify import ordering
        run: |
          export PSPDEV="$GITHUB_WORKSPACE/.tools/pspdev"
          export PSPSDK="$PSPDEV/psp/sdk"
          export PATH="$PSPDEV/bin:$PSPSDK/bin:$PATH"
          build_log="$RUNNER_TEMP/chest-source-full-build.log"
          set -o pipefail
          cmake --build "$GITHUB_WORKSPACE/.work/build/chest-source-full" \
            -j 4 --verbose 2>&1 | tee "$build_log"
          test -f "$GITHUB_WORKSPACE/.work/build/chest-source-full/EBOOT.PBP"
          if grep -Fq \
            "Warning: could not fixup imports, stubs out of order." \
            "$build_log"; then
            echo "PSP import stubs are not linked in SDK order." >&2
            exit 1
          fi

      - name: Record EBOOT checksum
        run: sha256sum "$GITHUB_WORKSPACE/.work/build/chest-source-full/EBOOT.PBP"

      - name: Upload checkpoint EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: dusklight-psp-chest-source-full-eboot
          path: .work/build/chest-source-full/EBOOT.PBP
          if-no-files-found: error
          retention-days: 14
