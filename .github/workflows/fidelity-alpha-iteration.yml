name: F_SP108 alpha fidelity iteration

on:
  push:
    branches:
      - agent/psp-pc-fidelity-startup
    paths:
      - .github/workflows/fidelity-alpha-iteration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-alpha-game-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply alpha presentation patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dusklight-main/platforms/psp/src/canonical_game.cpp')
          s = p.read_text()
          old = 'output.presentation = presentation::Profile::OpaqueOnly;'
          new = 'output.presentation = presentation::Profile::Game;'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one presentation site, got {s.count(old)}')
          s = s.replace(old, new)
          old_log = 'render=opaque_unlit frame=1'
          if s.count(old_log) != 1:
              raise SystemExit(f'expected exactly one render marker, got {s.count(old_log)}')
          s = s.replace(old_log, 'render=game_alpha frame=1')
          p.write_text(s)
          PY
          git diff --check
          git diff -- dusklight-main/platforms/psp/src/canonical_game.cpp

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake git curl xz-utils xvfb libgl1 libegl1 mesa-vulkan-drivers pulseaudio

      - name: Bootstrap pinned PSP toolchain
        run: ./scripts/bootstrap-repro.sh

      - name: Build canonical Allegrex EBOOT
        run: |
          export PSPDEV="$GITHUB_WORKSPACE/.tools/pspdev"
          export PSPSDK="$PSPDEV/psp/sdk"
          export PATH="$PSPDEV/bin:$PSPSDK/bin:$PATH"
          psp-cmake -S test/dusklight-psp -B .work/build/fidelity-alpha -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build .work/build/fidelity-alpha -j 4
          test -f .work/build/fidelity-alpha/EBOOT.PBP
          "$PSPDEV/bin/psp-objdump" -f .work/build/fidelity-alpha/dusklight_psp.elf | tee .work/fidelity-alpha-objdump.log
          grep -F 'architecture: mips:allegrex' .work/fidelity-alpha-objdump.log
          sha256sum .work/build/fidelity-alpha/EBOOT.PBP | tee .work/fidelity-alpha-eboot.sha256

      - name: Upload alpha iteration EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: psp-fidelity-alpha-iteration
          path: |
            .work/build/fidelity-alpha/EBOOT.PBP
            .work/fidelity-alpha-eboot.sha256
            .work/fidelity-alpha-objdump.log
          if-no-files-found: error
          retention-days: 7

      - name: Publish source patch and remove iteration workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dusklight-main/platforms/psp/src/canonical_game.cpp
          git rm .github/workflows/fidelity-alpha-iteration.yml
          git diff --cached --check
          git commit -m 'Enable F_SP108 alpha presentation'
          git push origin HEAD:agent/psp-pc-fidelity-startup
