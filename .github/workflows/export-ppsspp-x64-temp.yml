name: Export PPSSPP x64 temp
on:
  workflow_dispatch:
  push:
    branches:
      - agent/intro-fsp102-environment-mainline
    paths:
      - .github/workflows/export-ppsspp-x64-temp.yml
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact official PPSSPP x86_64
        shell: bash
        run: |
          set -euo pipefail
          url=https://github.com/hrydgard/ppsspp/releases/download/v1.20.4/PPSSPP-v1.20.4-anylinux-x86_64.AppImage
          curl -fL "$url" -o PPSSPP-v1.20.4-anylinux-x86_64.AppImage
          echo '661c098e6b7f7610171a57b7c533ce8bba6f2312b71e76d61e850461973eba21  PPSSPP-v1.20.4-anylinux-x86_64.AppImage' | sha256sum -c -
          chmod +x PPSSPP-v1.20.4-anylinux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: ppsspp-x64-v1.20.4-temp
          path: PPSSPP-v1.20.4-anylinux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 1
