name: Export p7zip local tool temporary

on:
  push:
    branches:
      - agent/intro-fsp102-environment-mainline

jobs:
  export:
    if: github.event.head_commit.message == 'Temporarily export p7zip tool for local source extraction'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Package standalone 7zip runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y 7zip
          SEVEN="$(command -v 7zz)"
          test -x "$SEVEN"
          mkdir -p payload/bin
          cp -L "$SEVEN" payload/bin/7zz
          payload/bin/7zz i | head -20
          tar -C payload -czf 7zip-runtime.tar.gz .
          sha256sum 7zip-runtime.tar.gz > 7zip-runtime.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: p7zip-runtime-local-tool
          path: |
            7zip-runtime.tar.gz
            7zip-runtime.tar.gz.sha256
