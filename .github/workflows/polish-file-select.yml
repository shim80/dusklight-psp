name: Polish canonical file select presentation

on:
  push:
    branches:
      - agent/psp-pc-fidelity-startup
    paths:
      - .github/workflows/polish-file-select.yml

permissions:
  contents: write

jobs:
  polish-build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove debug-facing file select copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dusklight-main/platforms/psp/src/canonical_game.cpp')
          s = p.read_text()
          replacements = {
              'pspDebugScreenPrintf("D U S K L I G H T   P S P");':
                  'pspDebugScreenPrintf("D U S K L I G H T");',
              'pspDebugScreenPrintf("PUBLIC STARTUP ROUTE -> CANONICAL GAMEPLAY");':
                  'pspDebugScreenPrintf("SELECT SAVE FILE");',
              'pspDebugScreenPrintf("UP/DOWN FILE    X/START CONFIRM");':
                  'pspDebugScreenPrintf("UP/DOWN SELECT    X/START CONFIRM");',
              '    pspDebugScreenSetXY(5, 27);\n    pspDebugScreenPrintf("Startup presentation is synthetic/public in this build");\n':
                  '',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'expected one file-select anchor: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- dusklight-main/platforms/psp/src/canonical_game.cpp

      - name: Install and build Allegrex target
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake git curl xz-utils
          ./scripts/bootstrap-repro.sh
          export PSPDEV="$GITHUB_WORKSPACE/.tools/pspdev"
          export PSPSDK="$PSPDEV/psp/sdk"
          export PATH="$PSPDEV/bin:$PSPSDK/bin:$PATH"
          psp-cmake -S test/dusklight-psp -B .work/build/file-select-polish -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build .work/build/file-select-polish -j 4
          "$PSPDEV/bin/psp-objdump" -f .work/build/file-select-polish/dusklight_psp.elf | tee .work/file-select-polish-objdump.log
          grep -F 'architecture: mips:allegrex' .work/file-select-polish-objdump.log
          sha256sum .work/build/file-select-polish/EBOOT.PBP | tee .work/file-select-polish-eboot.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: psp-fidelity-file-select-polish
          path: |
            .work/build/file-select-polish/EBOOT.PBP
            .work/file-select-polish-eboot.sha256
            .work/file-select-polish-objdump.log
          if-no-files-found: error
          retention-days: 7

      - name: Publish file select polish and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dusklight-main/platforms/psp/src/canonical_game.cpp
          git rm .github/workflows/polish-file-select.yml
          git diff --cached --check
          git commit -m 'Polish canonical file select presentation'
          git push origin HEAD:agent/psp-pc-fidelity-startup
