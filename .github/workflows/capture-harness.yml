name: Temporary F_SP108 capture harness

on:
  push:
    branches:
      - agent/psp-pc-fidelity-startup
    paths:
      - .github/workflows/capture-harness.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Patch startup for capture only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dusklight-main/platforms/psp/src/canonical_startup_entry.cpp')
          s = p.read_text()
          needle = 'int run_canonical_startup_then_game() {\n'
          if s.count(needle) != 1:
              raise SystemExit('startup entry contract changed')
          s = s.replace(needle, needle + '    // Temporary CI capture harness only. Not committed to product source.\n    return run_canonical_game();\n', 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake git curl xz-utils
      - name: Bootstrap pinned PSP toolchain
        run: ./scripts/bootstrap-repro.sh
      - name: Build capture EBOOT
        run: |
          export PSPDEV="$GITHUB_WORKSPACE/.tools/pspdev"
          export PSPSDK="$PSPDEV/psp/sdk"
          export PATH="$PSPDEV/bin:$PSPSDK/bin:$PATH"
          psp-cmake -S test/dusklight-psp -B .work/build/capture-harness -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build .work/build/capture-harness -j 4
          "$PSPDEV/bin/psp-objdump" -f .work/build/capture-harness/dusklight_psp.elf | tee .work/capture-objdump.log
          grep -F 'architecture: mips:allegrex' .work/capture-objdump.log
          sha256sum .work/build/capture-harness/EBOOT.PBP | tee .work/capture-eboot.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: fsp108-capture-harness-eboot
          path: |
            .work/build/capture-harness/EBOOT.PBP
            .work/capture-eboot.sha256
            .work/capture-objdump.log
          if-no-files-found: error
          retention-days: 2
