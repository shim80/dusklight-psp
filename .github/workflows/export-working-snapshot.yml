name: Apply PSP PC fidelity checkpoint
on:
  push:
    branches:
      - agent/psp-pc-fidelity-startup
jobs:
  apply-and-validate:
    if: github.event.head_commit.message != 'Improve PSP startup and material fidelity'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble recovered fidelity patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          : > /tmp/pc-fidelity.patch
          for sha in \
            803b57497f177d229e99b780ced714928d7030ed \
            c13429a8dde21b35a369e784c836dbf98d897cf6 \
            2acf4a207dc888346a45ad53577ac0e5c80e382f \
            784b107b4d0a7cd55f91b1f13b7fa8ba92141ee0 \
            7d20ddf9bd7ad8807476819f02d942317b3b5a0c \
            0f8ef0a26f8507699eb667df4dd7c5563b5d0a3e \
            cf2b3f4302815cfd8c311ec035cf51b5fc8d6f36 \
            d287f93bdf592c8e5c3b31a37e12071c6be864b8 \
            71cf86c1439187f5aeafbf0021eda890533aca5e
          do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/shim80/dusklight-psp/git/blobs/$sha" \
              | python3 -c 'import base64,json,sys; sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)["content"]))' \
              >> /tmp/pc-fidelity.patch
          done
          echo 'adfbe7cf0aab0bcfd06beea9cc8ef220bc029103a731021e0b64afc834adce55  /tmp/pc-fidelity.patch' | sha256sum -c -
          git apply --check /tmp/pc-fidelity.patch
          git apply /tmp/pc-fidelity.patch
      - name: Validate source-safe contracts
        shell: bash
        run: |
          python3 -m py_compile tools/fsp102_environment_export.py tools/startup_logo_ui_export.py tools/startup_sequence_export.py tools/title_logo_export.py
          bash -n scripts/build-dusklight-startup-assets.sh scripts/build-fsp102-environment-assets.sh
          cmake -S test/material-pass-plan-host -B .work/material-pass -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build .work/material-pass -j 4
          ./.work/material-pass/material_pass_plan_host_test
          g++ -std=c++20 -Wall -Wextra -Werror -fsigned-char -fno-exceptions -fno-rtti -UNDEBUG \
            -I dusklight-main/platforms/psp/include \
            test/canonical-runtime/startup_runtime_host_test.cpp \
            dusklight-main/platforms/psp/src/startup_package.cpp \
            dusklight-main/platforms/psp/src/startup_runtime.cpp \
            -o .work/startup_runtime_host_test
          ./.work/startup_runtime_host_test
          python3 tools/startup_sequence_export.py .work/startup.dpst
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake git curl xz-utils xvfb libgl1 libegl1 mesa-vulkan-drivers pulseaudio
      - name: Bootstrap pinned PSP toolchain and PPSSPP
        run: ./scripts/bootstrap-repro.sh
      - name: Build Allegrex EBOOT
        shell: bash
        run: |
          export PSPDEV="$GITHUB_WORKSPACE/.tools/pspdev"
          export PSPSDK="$PSPDEV/psp/sdk"
          export PATH="$PSPDEV/bin:$PSPSDK/bin:$PATH"
          psp-cmake -S test/dusklight-psp -B .work/build/dusklight-psp -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build .work/build/dusklight-psp -j 4
          test -f .work/build/dusklight-psp/EBOOT.PBP
          "$PSPDEV/bin/psp-objdump" -f .work/build/dusklight-psp/dusklight_psp.elf | tee .work/objdump.log
          grep -F 'architecture: mips:allegrex' .work/objdump.log
          sha256sum .work/build/dusklight-psp/EBOOT.PBP | tee .work/eboot.sha256
      - name: Commit validated checkpoint
        shell: bash
        run: |
          git config user.name 'shim80 automation'
          git config user.email '22941009+shim80@users.noreply.github.com'
          git add -A
          git commit -m 'Improve PSP startup and material fidelity'
          git push origin HEAD:agent/psp-pc-fidelity-startup
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psp-pc-fidelity-checkpoint
          if-no-files-found: warn
          path: |
            .work/eboot.sha256
            .work/objdump.log
            .work/build/dusklight-psp/EBOOT.PBP
