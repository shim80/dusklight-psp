name: Export local intro tools temp
on:
  workflow_dispatch:
  push:
    branches:
      - agent/intro-fsp102-environment-mainline
    paths:
      - .github/workflows/export-local-intro-tools-temp.yml
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Collect source-safe exporters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload/tools
          cp tools/fsp102_environment_export.py payload/tools/
          cp tools/startup_logo_ui_export.py payload/tools/
          cp tools/title_logo_export.py payload/tools/
          cp tools/title_prompt_ui_export.py payload/tools/
      - name: Fetch PPSSPP v1.20.4 AppImage
        shell: bash
        run: |
          set -euo pipefail
          url="$(curl -fsSL https://api.github.com/repos/hrydgard/ppsspp/releases/tags/v1.20.4 | jq -r '.assets[] | select(.name|test("AppImage";"i")) | .browser_download_url' | head -1)"
          test -n "$url"
          curl -fL "$url" -o payload/PPSSPP-v1.20.4.AppImage
          chmod +x payload/PPSSPP-v1.20.4.AppImage
          sha256sum payload/PPSSPP-v1.20.4.AppImage > payload/PPSSPP-v1.20.4.AppImage.sha256
      - name: Upload local-only tooling
        uses: actions/upload-artifact@v4
        with:
          name: intro-local-tools-temp
          path: payload
          if-no-files-found: error
          retention-days: 1
