name: Export recovery base
on:
  push:
    branches:
      - agent/recover-codex-first-playable
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Package repository snapshot
        run: |
          tar --exclude=.git -czf "$RUNNER_TEMP/dusklight-recovery-base.tar.gz" .
          sha256sum "$RUNNER_TEMP/dusklight-recovery-base.tar.gz" > "$RUNNER_TEMP/dusklight-recovery-base.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dusklight-recovery-base
          path: |
            ${{ runner.temp }}/dusklight-recovery-base.tar.gz
            ${{ runner.temp }}/dusklight-recovery-base.tar.gz.sha256
          if-no-files-found: error
