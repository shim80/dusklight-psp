name: PSP startup save flow

on:
  push:
    branches:
      - agent/startup-save-flow
  workflow_dispatch:

jobs:
  startup-save:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake git curl xz-utils xvfb imagemagick libgl1 libegl1 mesa-vulkan-drivers pulseaudio

      - name: Verify host save, startup, asset and PSP control semantics
        run: |
          cmake -S test/startup-save-host -B .work/build/startup-save-host -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build .work/build/startup-save-host -j 4
          ./.work/build/startup-save-host/startup_save_host_test | tee .work/startup-save-host.log
          grep -F 'STARTUP_SAVE_FLOW_HOST_OK' .work/startup-save-host.log
          cmake -S test/startup-save-integration-host -B .work/build/startup-save-integration-host -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build .work/build/startup-save-integration-host -j 4
          ./.work/build/startup-save-integration-host/startup_save_integration_host_test | tee .work/startup-save-integration-host.log
          grep -F 'STARTUP_SAVE_INTEGRATION_HOST_OK' .work/startup-save-integration-host.log
          cmake -S test/canonical-assets-host -B .work/build/canonical-assets-host -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build .work/build/canonical-assets-host -j 4
          ./.work/build/canonical-assets-host/canonical_assets_host_test | tee .work/canonical-assets-host.log
          grep -F 'CANONICAL_ASSETS_HOST_OK stage=F_SP108 room=1 start=21 layer=0 paths=4 fail_closed=1' .work/canonical-assets-host.log
          cmake -S test/psp-controls-host -B .work/build/psp-controls-host -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build .work/build/psp-controls-host -j 4
          ./.work/build/psp-controls-host/psp_controls_host_test | tee .work/psp-controls-host.log
          grep -F 'PSP_CONTROLS_HOST_OK' .work/psp-controls-host.log

      - name: Bootstrap pinned PSP toolchain and PPSSPP
        run: ./scripts/bootstrap-repro.sh

      - name: Build PSP probe and reconstructed canonical EBOOT
        run: |
          export PSPDEV="$GITHUB_WORKSPACE/.tools/pspdev"
          export PSPSDK="$PSPDEV/psp/sdk"
          export PATH="$PSPDEV/bin:$PSPSDK/bin:$PATH"
          psp-cmake -S test/startup-save-psp -B .work/build/startup-save-psp -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build .work/build/startup-save-psp -j 4
          test -f .work/build/startup-save-psp/EBOOT.PBP
          sha256sum .work/build/startup-save-psp/EBOOT.PBP | tee .work/startup-save-eboot.sha256
          psp-cmake -S test/dusklight-psp -B .work/build/dusklight-psp -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build .work/build/dusklight-psp -j 4
          test -f .work/build/dusklight-psp/EBOOT.PBP
          test -f .work/build/dusklight-psp/dusklight_psp.elf
          "$PSPDEV/bin/psp-objdump" -f .work/build/dusklight-psp/dusklight_psp.elf | tee .work/canonical-objdump.log
          grep -F 'architecture: mips:allegrex' .work/canonical-objdump.log
          sha256sum .work/build/dusklight-psp/EBOOT.PBP | tee .work/canonical-eboot.sha256

      - name: Run canonical EBOOT in pinned PPSSPP and capture diagnostic framebuffer
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -uxo pipefail
          PPSSPP="$GITHUB_WORKSPACE/.tools/ppsspp/PPSSPP-v1.20.4-anylinux-x86_64.AppImage"
          mkdir -p .work/ppsspp-app
          cd .work/ppsspp-app
          "$PPSSPP" --appimage-extract >/dev/null || exit 1
          cd "$GITHUB_WORKSPACE"
          pulseaudio --start --exit-idle-time=-1 --log-target=file:"$GITHUB_WORKSPACE/.work/pulseaudio.log" || true
          sleep 2
          pactl info >.work/pactl-info.log 2>&1 || { cat .work/pulseaudio.log || true; cat .work/pactl-info.log || true; exit 1; }
          Xvfb :99 -screen 0 1280x720x24 >.work/xvfb.log 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          sleep 2
          .work/ppsspp-app/squashfs-root/AppRun .work/build/dusklight-psp/EBOOT.PBP >.work/ppsspp.log 2>&1 &
          PPSSPP_PID=$!
          sleep 8
          cat .work/ppsspp.log || true
          grep -F 'Booted .work/build/dusklight-psp/EBOOT.PBP' .work/ppsspp.log || exit 1
          import -window root .work/dusklight-psp-canonical-diagnostic.png || exit 1
          test "$(stat -c %s .work/dusklight-psp-canonical-diagnostic.png)" -gt 1000 || exit 1
          identify .work/dusklight-psp-canonical-diagnostic.png || exit 1
          kill "$PPSSPP_PID" 2>/dev/null || true
          pkill -f 'PPSSPP|ppsspp' 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true
          pulseaudio --kill 2>/dev/null || true

      - name: Upload PSP build and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dusklight-psp-startup-save-checkpoint
          if-no-files-found: warn
          path: |
            .work/build/startup-save-psp/EBOOT.PBP
            .work/startup-save-eboot.sha256
            .work/build/dusklight-psp/EBOOT.PBP
            .work/build/dusklight-psp/dusklight_psp.elf
            .work/canonical-eboot.sha256
            .work/canonical-objdump.log
            .work/startup-save-host.log
            .work/startup-save-integration-host.log
            .work/canonical-assets-host.log
            .work/psp-controls-host.log
            .work/dusklight-psp-canonical-diagnostic.png
            .work/ppsspp.log
            .work/xvfb.log
            .work/pulseaudio.log
            .work/pactl-info.log
