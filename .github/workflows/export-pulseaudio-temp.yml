name: Export source temporary

on:
  push:
    branches:
      - agent/fsp108-alpha-test-foliage-v2

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source
        run: |
          git ls-files -z | tar --null -T - -czf /tmp/dusklight-source-v2.tgz
          sha256sum /tmp/dusklight-source-v2.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: dusklight-source-v2
          path: /tmp/dusklight-source-v2.tgz
          if-no-files-found: error
          retention-days: 1
