name: Apply Codex first-playable recovery

on:
  push:
    branches:
      - agent/recover-codex-first-playable
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify exact Codex patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .recovery/codex-first-playable/patch-00.diffpart \
            .recovery/codex-first-playable/patch-01.diffpart \
            .recovery/codex-first-playable/patch-02.diffpart \
            .recovery/codex-first-playable/patch-03.diffpart \
            .recovery/codex-first-playable/patch-04.diffpart \
            .recovery/codex-first-playable/patch-05.diffpart \
            .recovery/codex-first-playable/patch-06-00.diffpart \
            .recovery/codex-first-playable/patch-06-01.diffpart \
            .recovery/codex-first-playable/patch-06-02.diffpart \
            .recovery/codex-first-playable/patch-07-00.diffpart \
            .recovery/codex-first-playable/patch-07-01.diffpart \
            .recovery/codex-first-playable/patch-07-02.diffpart \
            .recovery/codex-first-playable/patch-08-00.diffpart \
            .recovery/codex-first-playable/patch-08-01.diffpart \
            .recovery/codex-first-playable/patch-08-02.diffpart \
            .recovery/codex-first-playable/patch-09-00.diffpart \
            .recovery/codex-first-playable/patch-09-01.diffpart \
            .recovery/codex-first-playable/patch-09-02.diffpart \
            > /tmp/codex-first-playable.patch
          echo '52abff118ae74c511bd8a8bad5e7a6ffb11210260de092029853d43b05f28e43  /tmp/codex-first-playable.patch' | sha256sum -c -
          git apply --check /tmp/codex-first-playable.patch
          git apply /tmp/codex-first-playable.patch

      - name: Restore resolved conflict and untracked source files
        shell: bash
        run: |
          set -euo pipefail
          cp .recovery/codex-first-playable/STATUS.resolved docs/STATUS.md
          mkdir -p scripts test/canonical-runtime test/material-pass-plan-host tools
          cp .recovery/codex-first-playable/untracked/build-demo38-camera-assets.sh scripts/build-demo38-camera-assets.sh
          cp .recovery/codex-first-playable/untracked/material_pass_plan_host_test.cpp test/canonical-runtime/material_pass_plan_host_test.cpp
          cp .recovery/codex-first-playable/untracked/material-pass-plan-host-CMakeLists.txt test/material-pass-plan-host/CMakeLists.txt
          cat \
            .recovery/codex-first-playable/untracked/demo38_camera_export.py.part00 \
            .recovery/codex-first-playable/untracked/demo38_camera_export.py.part01 \
            .recovery/codex-first-playable/untracked/demo38_camera_export.py.part02 \
            .recovery/codex-first-playable/untracked/demo38_camera_export.py.part03 \
            > tools/demo38_camera_export.py
          chmod +x scripts/build-demo38-camera-assets.sh tools/demo38_camera_export.py
          cat > /tmp/recovered.sha256 <<'EOF'
          71fb36813ac53cee48a74ebc20bca22a7a4f7efb95bd379dee8783e0adafe2c1  docs/STATUS.md
          b6db9490422b87c900650a8632d71bc273ada42542cfa6ecb438db62e516c79f  scripts/build-demo38-camera-assets.sh
          5582799c8450401e58a1bb4277b396ab4ce964d3a68f0ae0f1fb534dc019eb31  test/canonical-runtime/material_pass_plan_host_test.cpp
          e6b67caee746d03e4c8df6cfaf9d9aff58c35b225ec3b2ca2025f75dff12215b  test/material-pass-plan-host/CMakeLists.txt
          6074002f1172df1080e03e35127f4cd891b85b5da56d8cd486186369a3758c91  tools/demo38_camera_export.py
          EOF
          sed -i 's/^          //' /tmp/recovered.sha256
          sha256sum -c /tmp/recovered.sha256

      - name: Validate recovery and publish clean source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/demo38_camera_export.py tools/fsp102_environment_export.py tools/startup_logo_ui_export.py tools/title_logo_export.py tools/title_prompt_ui_export.py
          bash -n scripts/bootstrap-fsp102-exporter.sh scripts/build-demo38-camera-assets.sh scripts/build-dusklight-psp-assets.sh scripts/build-dusklight-startup-assets.sh scripts/build-fsp102-environment-assets.sh
          rm -rf .recovery
          rm -f .github/workflows/apply-codex-recovery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -E '\.(iso|arc|bmd|bti|bck|stb|dprm|dptx|dpan|dpsu|dpcm|pbp|elf|7z)$'; then
            echo 'commercial-derived or binary asset path unexpectedly staged' >&2
            exit 1
          fi
          git commit -m 'Recover Codex first-playable checkpoint'
          git push origin HEAD:agent/recover-codex-first-playable
