name: Export F_SP102 host dependency temporary

on:
  push:
    branches:
      - agent/intro-fsp102-environment-mainline

jobs:
  export:
    if: github.event.head_commit.message == 'Temporarily export pinned F_SP102 host dependency'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch pinned gclib source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/LagoLunatic/gclib.git gclib
          git -C gclib checkout --detach 64127742467acb633d51685b9b1798ab45bb4034
          test "$(git -C gclib rev-parse HEAD)" = 64127742467acb633d51685b9b1798ab45bb4034
          rm -rf gclib/.git
          tar -czf gclib-6412774.tar.gz gclib
          sha256sum gclib-6412774.tar.gz > gclib-6412774.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gclib-6412774-source
          path: |
            gclib-6412774.tar.gz
            gclib-6412774.tar.gz.sha256
