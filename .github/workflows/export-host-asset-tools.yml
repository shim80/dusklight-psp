name: Export pinned host asset tools

on:
  push:
    branches:
      - agent/intro-environment

jobs:
  export-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned gclib source
        run: |
          set -euo pipefail
          git clone https://github.com/LagoLunatic/gclib.git .work/gclib
          git -C .work/gclib checkout --detach 64127742467acb633d51685b9b1798ab45bb4034
          test "$(git -C .work/gclib rev-parse HEAD)" = 64127742467acb633d51685b9b1798ab45bb4034
          rm -rf .work/gclib/.git
          tar -czf .work/gclib-6412774.tar.gz -C .work gclib
          sha256sum .work/gclib-6412774.tar.gz
      - name: Upload pinned gclib source
        uses: actions/upload-artifact@v4
        with:
          name: gclib-6412774-source
          if-no-files-found: error
          retention-days: 1
          path: .work/gclib-6412774.tar.gz
