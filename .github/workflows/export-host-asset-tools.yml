name: Export pinned host asset tools

on:
  push:
    branches:
      - agent/startup-save-flow

jobs:
  export-tools:
    if: github.event.head_commit.message == 'Export pinned host asset tools'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout PSP overlay history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake git curl zstd clang cargo

      - name: Recover exact historical PSP overlay
        run: |
          set -euo pipefail
          mkdir -p .work/recovered
          git show 4df42572f9087472e3eb4891583971aad8dcff88:source-overlay/dusklight-psp-code-overlay.tar.gz.b64 \
            | base64 -d \
            | tar -xz -C .work/recovered
          find .work/recovered -maxdepth 4 -type d -path '*/tools/*' -print | sort
          PROBE_DIR="$(find .work/recovered -type d -path '*/tools/dusk_link_loader_probe' -print -quit)"
          BUILDER_DIR="$(find .work/recovered -type d -path '*/tools/dusk_startup_builder' -print -quit)"
          test -n "$PROBE_DIR"
          test -n "$BUILDER_DIR"
          printf 'PROBE_DIR=%s\nBUILDER_DIR=%s\n' "$PROBE_DIR" "$BUILDER_DIR" >> "$GITHUB_ENV"

      - name: Assemble pinned Dusklight tool source
        run: |
          set -euo pipefail
          git clone https://github.com/TwilitRealm/dusklight.git .work/full
          git -C .work/full checkout --detach 1bae8a5e6a812217ca33ba533e707ecfa64b1553
          rm -rf .work/full/platforms/psp .work/full/scripts .work/full/toolchain
          cp -a dusklight-main/platforms/psp .work/full/platforms/psp
          cp -a scripts .work/full/scripts
          cp -a toolchain .work/full/toolchain
          mkdir -p .work/full/tools
          cp -a "$PROBE_DIR" .work/full/tools/dusk_link_loader_probe
          cp -a "$BUILDER_DIR" .work/full/tools/dusk_startup_builder

      - name: Bootstrap pinned loader dependencies
        working-directory: .work/full
        run: ./scripts/bootstrap-link-loader-sources.sh

      - name: Build host conversion tools
        working-directory: .work/full
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        run: |
          set -euo pipefail
          ./scripts/build-link-loader-probe.sh
          cmake -S tools/dusk_startup_builder -B build/host/startup-builder -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host/startup-builder -j 4
          test -x build/host/link-loader/probe/dusk_link_loader_probe
          test -x build/host/startup-builder/dusk_startup_builder
          sha256sum \
            build/host/link-loader/probe/dusk_link_loader_probe \
            build/host/startup-builder/dusk_startup_builder \
            | tee build/host/asset-tools.sha256

      - name: Upload host asset tools
        uses: actions/upload-artifact@v4
        with:
          name: dusklight-host-asset-tools
          if-no-files-found: error
          path: |
            .work/full/build/host/link-loader/probe/dusk_link_loader_probe
            .work/full/build/host/startup-builder/dusk_startup_builder
            .work/full/build/host/asset-tools.sha256
