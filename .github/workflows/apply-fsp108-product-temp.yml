name: Apply F_SP108 product patch temporary

on:
  push:
    branches:
      - agent/fsp108-alpha-material-state

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Temporarily apply validated F_SP108 product patch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/fsp108-alpha-test-foliage-v2
          git show origin/agent/fsp108-alpha-test-foliage-v2:.github/workflows/build-canonical-eboot-temp.yml > /tmp/source-workflow.yml
          awk '/^[[:space:]]*H4sIA/{gsub(/^[[:space:]]+/, ""); print; exit}' /tmp/source-workflow.yml > /tmp/pev1.b64
          base64 -d /tmp/pev1.b64 | gzip -dc > /tmp/pev1.patch
          test "$(sha256sum /tmp/pev1.patch | awk '{print $1}')" = 395c46b1e840ccb07ca8265dba8450e08e6a9bba197d8ba937162db1487957d0
          git apply --check /tmp/pev1.patch
          git apply /tmp/pev1.patch
          g++ -std=c++20 -Wall -Wextra -Werror -fsigned-char -fno-exceptions -fno-rtti \
            -Idusklight-main/platforms/psp/include \
            test/canonical-runtime/alpha_material_state_host_test.cpp \
            dusklight-main/platforms/psp/src/room_package.cpp \
            -o /tmp/alpha_material_state_host_test
          /tmp/alpha_material_state_host_test
          git diff --check
          git rm .github/workflows/apply-fsp108-product-temp.yml
          git config user.name 'shim80'
          git config user.email '22941009+shim80@users.noreply.github.com'
          git add dusklight-main/platforms/psp/include/dusk/psp/playable_render.hpp \
                  dusklight-main/platforms/psp/include/dusk/psp/room_package.hpp \
                  dusklight-main/platforms/psp/src/playable_render.cpp \
                  dusklight-main/platforms/psp/src/room_package.cpp \
                  scripts/build-dusklight-psp-assets.sh \
                  test/canonical-runtime/CMakeLists.txt \
                  test/canonical-runtime/alpha_material_state_host_test.cpp
          git commit -m 'Restore source F_SP108 alpha material state'
          git push origin HEAD:agent/fsp108-alpha-material-state
