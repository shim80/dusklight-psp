name: Export PEV1 patch temporary

on:
  push:
    branches:
      - agent/fsp108-alpha-test-foliage-v2

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extract validated product patch
        shell: bash
        run: |
          set -euo pipefail
          awk '/^[[:space:]]*H4sIA/{gsub(/^[[:space:]]+/, ""); print; exit}' .github/workflows/build-canonical-eboot-temp.yml > /tmp/pev1.b64
          base64 -d /tmp/pev1.b64 | gzip -dc > /tmp/pev1.patch
          test "$(sha256sum /tmp/pev1.patch | awk '{print $1}')" = 395c46b1e840ccb07ca8265dba8450e08e6a9bba197d8ba937162db1487957d0
      - uses: actions/upload-artifact@v4
        with:
          name: fsp108-pev1-product-patch
          path: /tmp/pev1.patch
          if-no-files-found: error
          retention-days: 1
